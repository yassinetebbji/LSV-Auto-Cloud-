<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | LSV Auto Cloud</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to LSV Auto Cloud homepage.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.lsvautocloud.com/404.html">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>

    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-content {
            max-width: 600px;
            text-align: center;
        }

        .error-code {
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 800;
            color: var(--ink-900);
            line-height: 1;
            margin: 0;
            letter-spacing: -0.04em;
        }

        .error-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            color: var(--ink-900);
            margin: 20px 0 12px;
        }

        .error-text {
            font-size: 18px;
            color: var(--ink-500);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-links {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }

        .error-links-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-700);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .error-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .error-link {
            padding: 10px 16px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--ink-700);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition-normal) ease;
        }

        .error-link:hover {
            background: var(--surface);
            border-color: var(--ink-900);
            color: var(--ink-900);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-text">
                Sorry, we couldn't find the page you're looking for. It might have been moved, deleted, or the URL might be incorrect.
            </p>

            <div class="error-actions">
                <a href="/" class="btn btn-primary">Back to Homepage</a>
                <a href="/#contact" class="btn btn-secondary">Contact Us</a>
            </div>

            <div class="error-links">
                <div class="error-links-title">Popular Pages</div>
                <div class="error-links-grid">
                    <a href="/#features" class="error-link">Product</a>
                    <a href="/#process" class="error-link">How it Works</a>
                    <a href="/#proof" class="error-link">Results</a>
                    <a href="/#book-demo" class="error-link">Book a Demo</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
